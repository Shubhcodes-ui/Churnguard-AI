version: "3.9"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: churnguard
      POSTGRES_PASSWORD: churnguard_secret
      POSTGRES_DB: churnguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churnguard"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── FastAPI Backend ──────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://churnguard:churnguard_secret@db:5432/churnguard
      SECRET_KEY: production-secret-key-change-this-in-real-deploy
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://frontend:80
      MODEL_DIR: /app/ml_models
      DATA_DIR: /app/data
    volumes:
      - model_data:/app/ml_models
      - upload_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # ── React Frontend (Nginx) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  model_data:
  upload_data:
